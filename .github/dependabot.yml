version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/key/aws"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
