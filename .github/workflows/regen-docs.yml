name: Auto-regenerate reference docs

# On every same-repo PR push, regenerate docs/reference/ and, when the output
# changed, push the fix to the PR branch — contributors never run the docs
# generator by hand. Fork PRs are skipped (GITHUB_TOKEN cannot push to forks);
# the freshness warning in test.yml still tells fork authors the manual command.
#
# Loop guard: the job skips when the actor is github-actions[bot] (GraphQL-created
# commits do re-trigger pull_request), and a re-run would find no diff anyway. The same property means CI results shown on the PR
# belong to the contributor's last commit; the bot commit only touches
# docs/reference/, which no test job consumes.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: regen-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regen:
    # actor guard: createCommitOnBranch commits DO re-trigger pull_request, unlike GITHUB_TOKEN git pushes
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true

      - name: Regenerate reference
        run: ./scripts/gen-docs.sh

      - name: Collect reference changes
        id: changes
        run: |
          git add -A docs/reference/
          if git diff --cached --quiet; then
            echo "reference is current"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/doc-changes"
          git diff --cached --name-only --diff-filter=AM -z \
            | while IFS= read -r -d '' f; do base64 -w0 < "$f" > /tmp/b64; jq -n --arg p "$f" --rawfile c /tmp/b64 '{path: $p, contents: $c}'; done \
            | jq -s . > "$RUNNER_TEMP/doc-changes/additions.json"
          git diff --cached --name-only --diff-filter=D -z \
            | jq -Rs 'split("\u0000") | map(select(length > 0) | {path: .})' > "$RUNNER_TEMP/doc-changes/deletions.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.changes.outputs.changed == 'true'
        with:
          name: reference-changes
          path: ${{ runner.temp }}/doc-changes/*.json
          retention-days: 1

  # PR code runs only in the read-only job. This job consumes JSON as data,
  # validates destination paths, and never checks out or executes PR code.
  commit:
    needs: regen
    if: needs.regen.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference-changes
          path: ${{ runner.temp }}/doc-changes

      # The GraphQL API creates a signed commit that satisfies branch protection.
      - name: Commit reference changes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cd "$RUNNER_TEMP/doc-changes"
          jq -se 'all(.[]; type == "array" and all(.[]; .path | test("^docs/reference/([a-z0-9-]+\\.md|nav\\.json)$")))' additions.json deletions.json > /dev/null
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
            --slurpfile additions additions.json --slurpfile deletions deletions.json '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "docs: regenerate reference" },
                fileChanges: { additions: $additions[0], deletions: $deletions[0] }
              } }
            }' > /tmp/commit.json
          gh api graphql --input /tmp/commit.json --jq '.data.createCommitOnBranch.commit.oid'
