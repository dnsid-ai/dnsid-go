# Lint, test and security scanning on every pull request, from the shared
# workflow in dnsid-ai/github-actions. Make "go / Summary" the one required
# check on main.
name: Security

on:
  pull_request:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go:
    uses: dnsid-ai/github-actions/.github/workflows/security-go.yml@b4d14ab990cee173375c13f9b0ba24105ac0b778 # v1.4.0
    permissions:
      contents: read # check out the code
      security-events: write # required by the called workflow's jobs
      actions: read # required by the called workflow's jobs
      pull-requests: write # the Summary job posts a sticky go: summary comment with findings
    with:
      # test.yml already runs these; don't duplicate here.
      lint: false
      test: false
      # Integration tests may need live infra; -short runs units only.
      test-flags: -short
      # Code Security not enabled; findings live in the run summary and artifacts.
      # Scan this repo's own GitHub Actions workflows with CodeQL (shared v1.4.0).
      codeql-actions: true
      upload-sarif: true
      # Warn-only while first findings are triaged; flip to true after.
      enforce-security: false
