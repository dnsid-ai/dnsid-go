# golangci-lint configuration for the dnsid-go SDK.
#
# Doc-comment coverage on exported identifiers is enforced separately by
# revive (see revive.toml) — that runs over the public packages only, so it
# is deliberately not duplicated here.
version: "2"

run:
  # key/aws is a separate module; CI lints it with its own invocation.
  timeout: 5m

# Report every occurrence: the defaults (max-issues-per-linter 50,
# max-same-issues 3) silently hide repeats, which makes a clean run
# indistinguishable from a truncated one.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTP response bodies must be closed
    - errorlint # %w / errors.Is / errors.As correctness
    - misspell
    - noctx # HTTP requests must carry a context
    - unconvert # redundant type conversions
    - usestdlibvars # http.MethodGet over "GET", etc.

  settings:
    errcheck:
      check-type-assertions: true
    # govet's `shadow` check is deliberately left off: the codebase shadows
    # `err` and `ctx` idiomatically in ~50 places and the rewrites would be
    # pure churn.

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Table-driven tests shadow freely and assert loosely; the signal
      # from these linters is not worth the churn in _test.go files.
      - path: _test\.go$
        linters:
          - bodyclose
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
